<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Website</title>
    <link rel="stylesheet" href="style8.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <div class="logo-top">FOOD</div>
            <div class="logo-bottom">Delicious Food</div>
        </header>

        <nav class="navbar">

            <div class="nav-icon-container">
                <img
                    class="nav-icon"
                    src="https://cdn-icons-png.flaticon.com/512/3595/3595455.png"
                    alt="Food icon"
                >
            </div>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

        </nav>

        <section class="hero">

            <h2>Welcome to Our Restaurant</h2>

            <button class="order-btn">
                Order Now
            </button>

            <div class="hero-cards">

                <div class="card">
                    <img
                        src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500"
                        alt="Pizza"
                    >
                    <div class="card-label">Pizza</div>
                </div>

                <div class="card">
                    <img
                        src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=500"
                        alt="Dessert"
                    >
                    <div class="card-label">Dessert</div>
                </div>

            </div>

        </section>

        <div class="divider"></div>

        <section class="featured">

            <h2 class="section-title">
                Featured Products
            </h2>

            <div class="product-grid">

                <div class="product">
                    <img
                        src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=500"
                        alt="Pizza"
                    >

                    <button class="order-btn-small">
                        Order
                    </button>
                </div>

                <div class="product">
                    <img
                        src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=500"
                        alt="Donuts"
                    >

                    <button class="order-btn-small">
                        Order
                    </button>
                </div>

                <div class="product">
                    <img
                        src="https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=500"
                        alt="Pasta"
                    >

                    <button class="order-btn-small">
                        Order
                    </button>
                </div>

            </div>

        </section>

        <footer class="footer">
            <p>© 2024 Delicious Food. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
